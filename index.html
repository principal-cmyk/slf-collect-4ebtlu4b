:root{
  --green:#002368; --green-dark:#002368; --green-light:#d9ecf9;
  --amber:#b68a2d; --gold:#ffc952; --gold-light:#fff7e5;
  --red:#b23b3b; --red-light:#fbeaea;
  --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f8; --card:#ffffff;
  --radius:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Montserrat',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;}
header{background:var(--green);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;}
header img.mark{height:34px;flex:none;}
header h1{font-size:16px;margin:0;font-weight:700;flex:1;line-height:1.25;}
header h1 small{display:block;font-size:11px;font-weight:400;opacity:.85;letter-spacing:.04em;}
header .back{background:none;border:none;color:#fff;font-size:22px;padding:0 6px;cursor:pointer;}
main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:90px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin:0 0 10px;color:var(--green-dark);}
.btn{display:inline-block;border:none;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:600;cursor:pointer;background:var(--green);color:#fff;}
.btn.secondary{background:#fff;color:var(--green-dark);border:1.5px solid var(--green);}
.btn.danger{background:var(--red);}
.btn.block{display:block;width:100%;text-align:center;margin-top:10px;}
.btn:disabled{opacity:.45;cursor:default;}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);}
.pills{display:flex;gap:8px;flex-wrap:wrap;}
.pill{flex:1;min-width:80px;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;background:#fff;}
.pill.sel{background:var(--green);color:#fff;border-color:var(--green);}
.pill.disabled{opacity:.35;cursor:not-allowed;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;}
.grid.words{grid-template-columns:repeat(4,1fr);}
.grid.wide{grid-template-columns:repeat(2,1fr);}
.cell{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px 4px;text-align:center;font-size:20px;font-weight:700;cursor:pointer;user-select:none;min-height:58px;display:flex;flex-direction:column;justify-content:center;}
.cell .key{font-size:11px;font-weight:400;color:var(--muted);margin-top:2px;}
.cell.wrong{background:var(--red-light);border-color:var(--red);color:var(--red);}
.cell.wrong::after{content:"✕";position:absolute;top:3px;right:7px;font-size:12px;}
.cell.beyond{opacity:.35;}
.cell.endmark{box-shadow:0 0 0 3px var(--gold);}
.cell .num{position:absolute;top:3px;left:7px;font-size:10px;color:var(--muted);font-weight:400;}
.timerbar{position:sticky;top:52px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.timerbar .time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green-dark);min-width:74px;}
.timerbar .time.warn{color:var(--amber);}
.timerbar .tbtns{display:flex;gap:8px;flex:1;justify-content:flex-end;flex-wrap:wrap;}
.timerbar .btn{padding:9px 13px;font-size:14px;}
.say{background:var(--green-light);border-left:4px solid var(--green);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:10px 0;}
.say b{color:var(--green-dark);}
.purpose{font-size:13px;color:var(--muted);margin:4px 0;}
.passage{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px;font-size:19px;line-height:1.9;margin-top:10px;}
.qrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;}
.qrow .qt{flex:1;}
.qrow .qt .k{font-size:12px;color:var(--muted);}
.qbtn{width:52px;height:44px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:19px;cursor:pointer;}
.qbtn.c.on{background:var(--green);color:#fff;border-color:var(--green);}
.qbtn.x.on{background:var(--red);color:#fff;border-color:var(--red);}
.rubric-row{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;}
.rubric-row .sk{font-size:14px;margin-bottom:8px;}
.scale{display:flex;gap:6px;}
.scale button{flex:1;padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.scale button.on{background:var(--green);color:#fff;border-color:var(--green);}
.progress{font-size:13px;color:var(--muted);margin-bottom:8px;}
.summary-table{width:100%;border-collapse:collapse;font-size:14px;}
.summary-table td,.summary-table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
.summary-table td:last-child{text-align:right;font-weight:700;}
.rec{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.rec:last-child{border-bottom:none;}
.rec .info{flex:1;font-size:14px;}
.rec .info .sub{color:var(--muted);font-size:12px;}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.badge.synced{background:var(--green-light);color:var(--green-dark);}
.badge.pending{background:var(--gold-light);color:var(--amber);}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.home-count{font-size:36px;font-weight:800;color:var(--green-dark);}
.warn-note{background:var(--gold-light);border-left:4px solid var(--gold);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:10px 0;}
.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;}
.stepdots{display:flex;gap:6px;margin:4px 0 12px;}
.stepdots span{height:6px;flex:1;border-radius:3px;background:var(--line);}
.stepdots span.done{background:var(--green);}
.stepdots span.cur{background:var(--amber);}
@media(max-width:420px){.grid{grid-template-columns:repeat(5,1fr);gap:6px;}.cell{font-size:17px;padding:10px 2px;min-height:52px;}}
</style>

<main id="app"></main>
<div class="toast" id="toast"></div>
<script type="text/plain" id="__app">
const BANK = window.__SLF_BANK;
/* ---------- storage (guarded) ---------- */
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}};}})();
const loadJ=(k,d)=>{try{const v=store.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const saveJ=(k,v)=>store.setItem(k,JSON.stringify(v));
const DEFAULT_SYNC_URL=window.__SLF_URL;
let settings=loadJ('slf_settings',{school:'',district:'',assessor:'',syncUrl:DEFAULT_SYNC_URL});
if(!settings.syncUrl)settings.syncUrl=DEFAULT_SYNC_URL;
let records=loadJ('slf_records',[]);
const persist=()=>{saveJ('slf_settings',settings);saveJ('slf_records',records);};
const uid=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return Date.now().toString(36)+'-'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');};
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function beep(freq=880,dur=0.35){try{const ctx=beep._c||(beep._c=new (window.AudioContext||window.webkitAudioContext)());const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.35,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
const grades=BANK.grades;
const findAssessment=(g,tool,round)=>{const gr=grades.find(x=>x.grade===g);return gr&&gr.assessments.find(a=>a.tool===tool&&a.round===round);};
/* ---------- router ---------- */
let view={name:'home'};let session=null;
function go(v){view=v;render();window.scrollTo(0,0);}
$('#backBtn') .addEventListener('click',()=>{
  if(view.name==='subtask'||view.name==='summary'){if(confirm('Leave this assessment? Progress on the current student will be kept in memory until you exit setup.')){go({name:'home'});}}
  else go({name:'home'});
});
/* ---------- views ---------- */
function render(){
  const app=$('#app');app.innerHTML='';
  $('#backBtn').style.display=view.name==='home'?'none':'';
  if(view.name==='home')return renderHome(app);
  if(view.name==='settings')return renderSettings(app);
  if(view.name==='setup')return renderSetup(app);
  if(view.name==='subtask')return renderSubtask(app);
  if(view.name==='summary')return renderSummary(app);
  if(view.name==='records')return renderRecords(app);
}
function renderHome(app){
  $('#hTitle').textContent='Assessment Collector';
  const pending=records.filter(r=>!r.synced).length;
  app.appendChild(el(`<div class="card"><h2>Assessments recorded on this device</h2>
    <div style="display:flex;gap:24px"><div><div class="home-count">${records.length}</div><div class="purpose">total</div></div>
    <div><div class="home-count" style="color:${pending?'var(--amber)':'var(--green-dark)'}">${pending}</div><div class="purpose">waiting to sync</div></div></div></div>`));
  if(!settings.school||!settings.assessor){app.appendChild(el(`<div class="warn-note">Select your campus and enter your name in <b>Settings</b> before starting.</div>`));}
  const b1=el(`<button class="btn block" style="font-size:18px;padding:16px">▶ Start new assessment</button>`);b1.onclick=()=>go({name:'setup'});app.appendChild(b1);
  const b2=el(`<button class="btn secondary block">☁ Sync now (${pending})</button>`);b2.onclick=syncNow;app.appendChild(b2);
  const b3=el(`<button class="btn secondary block">☰ Records &amp; export</button>`);b3.onclick=()=>go({name:'records'});app.appendChild(b3);
  const b4=el(`<button class="btn secondary block">⚙ Settings</button>`);b4.onclick=()=>go({name:'settings'});app.appendChild(b4);
  app.appendChild(el(`<div class="footer-note">Silverleaf Academy · EGRA / EGMA / SEL · works fully offline — sync when you have internet</div>`));
}
const CAMPUSES=['Usa River','Arusha Modern','Kijenge','Ilboru','Boma'];
function renderSettings(app){
  $('#hTitle').textContent='Settings';
  const known=CAMPUSES.includes(settings.school);
  const legacy=settings.school&&!known?`<option value="${esc(settings.school)}" selected>${esc(settings.school)} (old entry)</option>`:'';
  const c=el(`<div class="card">
    <label>Campus</label><select id="sSchool">
      <option value="" ${settings.school?'':'selected'} disabled>Select your campus…</option>
      ${CAMPUSES.map(x=>`<option value="${x}" ${settings.school===x?'selected':''}>${x}</option>`).join('')}
      ${legacy}
    </select>
    <label>District</label><input id="sDistrict" value="${esc(settings.district)}">
    <label>Assessor name</label><input id="sAssessor" value="${esc(settings.assessor)}">
    <label>Sync URL (Google Apps Script web app)</label><input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(settings.syncUrl)}">
    <button class="btn block" id="sSave">Save settings</button></div>`);
  app.appendChild(c);
  $('#sSave').onclick=()=>{
    if(!$('#sSchool').value){toast('Please select your campus');return;}
    settings={school:$('#sSchool').value,district:$('#sDistrict').value.trim(),assessor:$('#sAssessor').value.trim(),syncUrl:$('#sUrl').value.trim()};persist();toast('Settings saved');go({name:'home'});};
}
function renderSetup(app){
  $('#hTitle').textContent='New assessment';
  const st={grade:null,tool:null,round:null};
  const c=el(`<div class="card">
    <label>Grade</label><div class="pills" id="pGrade">${grades.map(g=>`<div class="pill" data-v="${g.grade}">${esc(g.gradeLabel)}</div>`).join('')}</div>
    <label>Assessment</label><div class="pills" id="pTool">${['EGRA','EGMA','SEL'].map(t=>`<div class="pill" data-v="${t}">${t}</div>`).join('')}</div>
    <label>Round</label><div class="pills" id="pRound">${['Baseline','Endline'].map(t=>`<div class="pill" data-v="${t}">${t}</div>`).join('')}</div>
    <label>Student ID / Code</label><input id="fSid" placeholder="e.g. SLV-0142" autocapitalize="characters">
    <label>Student gender</label><div class="pills" id="pGen"><div class="pill" data-v="F">Girl</div><div class="pill" data-v="M">Boy</div></div>
    <label>Class / stream (optional)</label><input id="fClass" placeholder="e.g. G1 Blue">
    <label id="lTeacher" style="display:none">Teacher name (SEL rater)</label><input id="fTeacher" style="display:none">
    <button class="btn block" id="startBtn" disabled>Begin assessment ▶</button></div>`);
  app.appendChild(c);
  const wire=(id,key)=>{ $('#'+id).addEventListener('click',e=>{const p=e.target.closest('.pill');if(!p||p.classList.contains('disabled'))return;[...e.currentTarget.children].forEach(x=>x.classList.remove('sel'));p.classList.add('sel');st[key]=p.dataset.v;
    if(key==='tool'){const s=st.tool==='SEL';$('#lTeacher').style.display=s?'':'none';$('#fTeacher').style.display=s?'':'none';}
    if(key==='grade'){const gr=grades.find(x=>x.grade===st.grade);
      [...document.querySelectorAll('#pTool .pill')].forEach(tp=>{
        const has=gr&&gr.assessments.some(a=>a.tool===tp.dataset.v);
        tp.classList.toggle('disabled',!has);
        if(!has&&st.tool===tp.dataset.v){tp.classList.remove('sel');st.tool=null;}
      });}
    check();});};
  wire('pGrade','grade');wire('pTool','tool');wire('pRound','round');wire('pGen','gender');
  $('#fSid').addEventListener('input',check);
  function check(){$('#startBtn').disabled=!(st.grade&&st.tool&&st.round&&st.gender&&$('#fSid').value.trim());}
  $('#startBtn').onclick=()=>{
    const a=findAssessment(st.grade,st.tool,st.round);
    if(!a){toast('That assessment was not found in the item bank');return;}
    session={id:uid(),meta:{grade:st.grade,gradeLabel:grades.find(g=>g.grade===st.grade).gradeLabel,tool:st.tool,round:st.round,
      student_id:$('#fSid').value.trim(),gender:st.gender,class:$('#fClass').value.trim(),teacher:$('#fTeacher').value.trim(),
      school:settings.school,district:settings.district,assessor:settings.assessor,started:new Date().toISOString()},
      a, idx:0, results:{}};
    go({name:'subtask'});
  };
}
/* ---------- subtask runner ---------- */
function renderSubtask(app){
  const a=session.a, st=a.subtasks[session.idx];
  $('#hTitle').textContent=`${session.meta.tool} ${session.meta.round} · ${session.meta.gradeLabel}`;
  app.appendChild(el(`<div class="stepdots">${a.subtasks.map((s,i)=>`<span class="${i<session.idx?'done':i===session.idx?'cur':''}"></span>`).join('')}</div>`));
  app.appendChild(el(`<div class="progress">Subtask ${session.idx+1} of ${a.subtasks.length} — <b>${esc(st.name)}</b> · Student ${esc(session.meta.student_id)}</div>`));
  if(st.purpose)app.appendChild(el(`<div class="purpose">${esc(st.purpose)}</div>`));
  if(st.say)app.appendChild(el(`<div class="say"><b>SAY:</b> ${esc(st.say)}</div>`));
  if(st.type==='timed')renderTimed(app,st);
  else if(st.type==='untimed')renderUntimed(app,st);
  else renderRubric(app,st);
}
function isWordy(st){return st.items.some(i=>String(i.display).length>4);}
function renderTimed(app,st){
  const res=session.results[st.id]||(session.results[st.id]={wrong:{},last:st.items.length,timeUsed:null,discontinued:false,started:false});
  const limit=st.timeLimitSec||60;
  const bar=el(`<div class="timerbar"><div class="time" id="tDisp">${limit}s</div><div class="tbtns">
     <button class="btn" id="tStart">Start ▶</button>
     <button class="btn secondary" id="tStop" style="display:none">Finished early ■</button>
     <button class="btn secondary" id="tEnd">Mark last item</button></div></div>`);
  app.appendChild(bar);
  if(st.practice&&st.practice.length)app.appendChild(el(`<div class="purpose">Practice (before timer): ${st.practice.map(p=>`<b>${esc(p.display)}</b>${p.key?' ['+esc(p.key)+']':''}`).join(' · ')}</div>`));
  if(st.passage)app.appendChild(el(`<div class="passage">${esc(st.passage)}</div><div class="purpose" style="margin-top:6px">Follow on this passage as the student reads; tap each word below that is read incorrectly.</div>`));
  if(st.discontinue)app.appendChild(el(`<div class="warn-note">Discontinue rule: ${esc(st.discontinue)}</div>`));
  const grid=el(`<div class="grid ${isWordy(st)?'words':''}"></div>`);
  st.items.forEach((it,i)=>{
    const c=el(`<div class="cell"><span class="num">${it.n}</span>${esc(it.display)}${it.key&&String(it.key)!==String(it.display)?`<span class="key">${esc(it.key)}</span>`:''}</div>`);
    c.onclick=()=>{
      if(endMode){res.last=i+1;endMode=false;$('#tEnd').classList.remove('danger');paint();return;}
      if(res.wrong[i]){delete res.wrong[i];}else{res.wrong[i]=1;}
      paint();checkDiscontinue();
    };
    grid.appendChild(c);
  });
  app.appendChild(grid);
  const nav=el(`<button class="btn block" id="nextBtn">Next subtask ›</button>`);nav.onclick=()=>finishTimed();app.appendChild(nav);
  let endMode=false,timer=null,remaining=limit;
  function paint(){[...grid.children].forEach((c,i)=>{c.classList.toggle('wrong',!!res.wrong[i]);c.classList.toggle('beyond',i>=res.last);c.classList.toggle('endmark',i===res.last-1);});}
  paint();
  $('#tEnd').onclick=()=>{endMode=!endMode;$('#tEnd').classList.toggle('danger',endMode);toast(endMode?'Now tap the LAST item the student attempted':'Cancelled');};
  $('#tStart').onclick=()=>{
    res.started=true;remaining=limit;res.timeUsed=limit;
    $('#tStart').style.display='none';$('#tStop').style.display='';
    timer=setInterval(()=>{remaining--;const d=$('#tDisp');if(d){d.textContent=remaining+'s';d.classList.toggle('warn',remaining<=10);}
      if(remaining<=0){clearInterval(timer);timer=null;beep();toast('Time! Say STOP. Now mark the last item attempted.');$('#tStop').style.display='none';}
    },1000);
  };
  $('#tStop').onclick=()=>{if(timer){clearInterval(timer);timer=null;}res.timeUsed=limit-remaining;beep(660,.2);toast('Stopped at '+res.timeUsed+'s (student finished all items)');res.last=st.items.length;paint();$('#tStop').style.display='none';};
  function checkDiscontinue(){
    if(!st.discontinue||res.discontinued)return;
    const firstFiveWrong=[0,1,2,3,4].every(i=>res.wrong[i]);
    if(firstFiveWrong&&st.items.length>=5){
      if(confirm('First 5 items are all incorrect. Apply the discontinue rule (record 0 and move on)?')){
        res.discontinued=true;res.last=5;res.timeUsed=res.timeUsed||limit;if(timer){clearInterval(timer);timer=null;}
        finishTimed();
      }
    }
  }
  function finishTimed(){
    if(timer){clearInterval(timer);timer=null;}
    if(!res.started&&!res.discontinued){if(!confirm('The timer was never started. Save this subtask anyway?'))return;}
    if(res.timeUsed==null)res.timeUsed=limit;
    nextSubtask();
  }
}
function renderUntimed(app,st){
  const res=session.results[st.id]||(session.results[st.id]={marks:{}});
  if(st.passage)app.appendChild(el(`<div class="passage" style="font-size:16px;line-height:1.7">${esc(st.passage)}</div>`));
  st.items.forEach((it,i)=>{
    const r=el(`<div class="qrow"><div class="qt"><div>${it.n}. ${esc(it.display)}</div>${it.key?`<div class="k">Expected: ${esc(it.key)}</div>`:''}</div>
      <button class="qbtn c">✓</button><button class="qbtn x">✕</button></div>`);
    const [bc,bx]=r.querySelectorAll('.qbtn');
    const paint=()=>{bc.classList.toggle('on',res.marks[i]===1);bx.classList.toggle('on',res.marks[i]===0);};
    bc.onclick=()=>{res.marks[i]=res.marks[i]===1?undefined:1;paint();};
    bx.onclick=()=>{res.marks[i]=res.marks[i]===0?undefined:0;paint();};
    paint();app.appendChild(r);
  });
  const nav=el(`<button class="btn block">Next subtask ›</button>`);
  nav.onclick=()=>{const un=st.items.filter((_,i)=>res.marks[i]===undefined).length;
    if(un&&!confirm(un+' question(s) not marked — they will count as not administered. Continue?'))return;
    nextSubtask();};
  app.appendChild(nav);
}
function renderRubric(app,st){
  const res=session.results[st.id]||(session.results[st.id]={scores:{},notes:{}});
  if(st.scale)app.appendChild(el(`<div class="purpose">${st.scale.map(s=>`<b>${s.score}</b> ${esc(s.label)}`).join(' · ')}</div>`));
  st.items.forEach((it,i)=>{
    const r=el(`<div class="rubric-row"><div class="sk">${it.n}. ${esc(it.display)}</div><div class="scale"></div></div>`);
    const sc=r.querySelector('.scale');
    [0,1,2,3].forEach(v=>{const b=el(`<button>${v}</button>`);b.onclick=()=>{res.scores[i]=res.scores[i]===v?undefined:v;[...sc.children].forEach((x,xi)=>x.classList.toggle('on',res.scores[i]===xi));};
      if(res.scores[i]===v)b.classList.add('on');sc.appendChild(b);});
    app.appendChild(r);
  });
  const nav=el(`<button class="btn block">Next ›</button>`);
  nav.onclick=()=>{const un=st.items.filter((_,i)=>res.scores[i]===undefined).length;
    if(un&&!confirm(un+' row(s) not rated — continue anyway?'))return;
    nextSubtask();};
  app.appendChild(nav);
}
function nextSubtask(){
  if(session.idx<session.a.subtasks.length-1){session.idx++;go({name:'subtask'});}
  else go({name:'summary'});
}
/* ---------- scoring ---------- */
function scoreSubtask(st,res){
  if(!res)return{administered:false};
  if(st.type==='rubric'){
    const vals=st.items.map((_,i)=>res.scores[i]).filter(v=>v!==undefined);
    const total=vals.reduce((a,b)=>a+b,0);
    return{administered:vals.length>0,total,max:st.maxScore||st.items.length*3,rated:vals.length};
  }
  if(st.type==='untimed'){
    const marked=st.items.map((_,i)=>res.marks[i]).filter(v=>v!==undefined);
    const correct=marked.filter(v=>v===1).length;
    return{administered:marked.length>0,attempted:marked.length,correct,pct:marked.length?Math.round(100*correct/marked.length):0};
  }
  const attempted=res.discontinued?5:res.last;
  const wrongIn=Object.keys(res.wrong).map(Number).filter(i=>i<attempted).length;
  const correct=res.discontinued?0:Math.max(0,attempted-wrongIn);
  const t=res.timeUsed||st.timeLimitSec||60;
  const fluency=res.discontinued?0:Math.round(correct/t*60*10)/10;
  return{administered:res.started||res.discontinued,attempted,correct,timeUsed:t,fluency,discontinued:!!res.discontinued,
    wrongItems:Object.keys(res.wrong).map(i=>st.items[i]&&st.items[i].n).filter(Boolean)};
}
function buildRecord(){
  const m=session.meta,a=session.a;
  const rec={record_id:session.id,timestamp:new Date().toISOString(),school:m.school,district:m.district,assessor:m.assessor,
    grade:m.grade,round:m.round,tool:m.tool,student_id:m.student_id,gender:m.gender,class:m.class,teacher:m.teacher,notes:m.notes||''};
  const detail={};
  let selTotal=0,selMax=0;
  a.subtasks.forEach((st,ix)=>{
    const s=scoreSubtask(st,session.results[st.id]);
    const p='s'+(ix+1);
    rec[p+'_name']=st.name;
    if(st.type==='rubric'){rec[p+'_score']=s.administered?s.total:'';rec[p+'_max']=s.max;selTotal+=s.total||0;selMax+=s.max||0;}
    else if(st.type==='untimed'){rec[p+'_correct']=s.administered?s.correct:'';rec[p+'_attempted']=s.administered?s.attempted:'';rec[p+'_pct']=s.administered?s.pct:'';}
    else{rec[p+'_correct']=s.administered?s.correct:'';rec[p+'_attempted']=s.administered?s.attempted:'';rec[p+'_time']=s.administered?s.timeUsed:'';
      rec[p+'_fluency']=s.administered?s.fluency:'';rec[p+'_metric']=st.metric==='raw'?'CIPM':st.metric;rec[p+'_discontinued']=s.discontinued?'Y':'';}
    detail[st.id]={name:st.name,type:st.type,...s};
  });
  if(m.tool==='SEL'){rec.sel_total=selTotal;rec.sel_max=selMax;}
  rec.items_json=JSON.stringify(detail);
  return rec;
}
function renderSummary(app){
  $('#hTitle').textContent='Summary — '+session.meta.student_id;
  const a=session.a;
  const rows=a.subtasks.map((st,ix)=>{
    const s=scoreSubtask(st,session.results[st.id]);
    let val='—';
    if(s.administered){
      if(st.type==='rubric')val=`${s.total} / ${s.max}`;
      else if(st.type==='untimed')val=`${s.correct}/${s.attempted} (${s.pct}%)`;
      else val=s.discontinued?'0 (discontinued)':`${s.correct}/${s.attempted} · ${s.fluency} ${st.metric==='raw'?'CIPM':st.metric}`;
    }
    return`<tr><td>${ix+1}. ${esc(st.name)}</td><td>${val}</td></tr>`;
  }).join('');
  app.appendChild(el(`<div class="card"><h2>${session.meta.tool} ${session.meta.round} · ${esc(session.meta.gradeLabel)} · ${session.meta.gender==='F'?'Girl':'Boy'}</h2>
    <table class="summary-table"><tr><th>Subtask</th><th style="text-align:right">Result</th></tr>${rows}</table>
    <label>Assessor notes / observations</label><textarea id="fNotes" rows="3">${esc(session.meta.notes||'')}</textarea></div>`));
  const save=el(`<button class="btn block" style="font-size:18px;padding:16px">💾 Save assessment</button>`);
  save.onclick=()=>{
    session.meta.notes=$('#fNotes').value.trim();
    const rec=buildRecord();rec.synced=false;
    records.push(rec);persist();
    toast('Saved. '+records.filter(r=>!r.synced).length+' record(s) waiting to sync.');
    session=null;go({name:'home'});
    if(navigator.onLine&&settings.syncUrl)syncNow(true);
  };
  app.appendChild(save);
  const back=el(`<button class="btn secondary block">‹ Review subtasks</button>`);back.onclick=()=>{session.idx=0;go({name:'subtask'});};app.appendChild(back);
}
/* ---------- records & export ---------- */
function renderRecords(app){
  $('#hTitle').textContent='Records';
  const c=el(`<div class="card"></div>`);
  if(!records.length)c.appendChild(el(`<div class="purpose">No assessments recorded yet.</div>`));
  [...records].reverse().forEach(r=>{
    const row=el(`<div class="rec"><div class="info"><b>${esc(r.student_id)}</b> · ${r.tool} ${r.round} ${r.grade}
      <div class="sub">${esc(r.school)} · ${new Date(r.timestamp).toLocaleString()}</div></div>
      <span class="badge ${r.synced?'synced':'pending'}">${r.synced?'Synced':'Pending'}</span></div>`);
    c.appendChild(row);
  });
  app.appendChild(c);
  const b1=el(`<button class="btn block">☁ Sync now</button>`);b1.onclick=syncNow;app.appendChild(b1);
  const b2=el(`<button class="btn secondary block">⬇ Export CSV (backup)</button>`);b2.onclick=exportCsv;app.appendChild(b2);
  const b3=el(`<button class="btn danger block">Delete synced records from this device</button>`);
  b3.onclick=()=>{if(confirm('Remove records already synced to the Google Sheet from this device?')){records=records.filter(r=>!r.synced);persist();render();}};
  app.appendChild(b3);
}
function exportCsv(){
  if(!records.length){toast('Nothing to export');return;}
  const cols=[...new Set(records.flatMap(r=>Object.keys(r)))].filter(k=>k!=='synced');
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=[cols.join(','),...records.map(r=>cols.map(k=>q(r[k])).join(','))].join('\n');
  if(window.SLFBridge&&window.SLFBridge.shareCsv){ // inside the Silverleaf Android app
    window.SLFBridge.shareCsv('silverleaf_assessments_'+new Date().toISOString().slice(0,10)+'.csv',csv);
    return;
  }
  const blob=new Blob(["﻿"+csv],{type:'text/csv;charset=utf-8'});
  const aEl=document.createElement('a');aEl.href=URL.createObjectURL(blob);
  aEl.download='silverleaf_assessments_'+new Date().toISOString().slice(0,10)+'.csv';aEl.click();
  toast('CSV downloaded');
}
async function syncNow(silent){
  if(!settings.syncUrl){if(silent!==true)toast('Add the Sync URL in Settings first');return;}
  const pending=records.filter(r=>!r.synced);
  if(!pending.length){if(silent!==true)toast('Everything is already synced');return;}
  if(silent!==true)toast('Syncing '+pending.length+' record(s)…');
  try{
    const resp=await fetch(settings.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({records:pending.map(({synced,...r})=>r)})});
    const out=await resp.json();
    if(out&&out.ok){
      const savedIds=new Set(out.saved_ids||pending.map(r=>r.record_id));
      records.forEach(r=>{if(savedIds.has(r.record_id))r.synced=true;});
      persist();toast('Synced ✓ ('+(out.saved||0)+' new, '+(out.skipped||0)+' already there)');render();
    }else toast('Sync failed: '+(out&&out.error||'unexpected reply'));
  }catch(e){toast('Sync failed — check internet and Sync URL');}
}
window.addEventListener('online',()=>{if(settings.syncUrl&&records.some(r=>!r.synced))syncNow(true);});
render();
</script>

  var B=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
  function decrypt(code){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey'])
      .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:B(ENC.salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:B(ENC.iv)},key,B(ENC.ct));})
      .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
  }
  function launch(payload){
    window.__SLF_BANK=payload.bank; window.__SLF_URL=payload.syncUrl;
    var g=document.getElementById('slfGate'); if(g)g.style.display='none';
    var s=document.createElement('script'); s.text=document.getElementById('__app').textContent;
    document.body.appendChild(s);
  }
  function showGate(){
    var g=document.getElementById('slfGate'); g.style.display='block';
    var tryCode=function(){
      var code=document.getElementById('slfGateCode').value.trim().toLowerCase();
      if(!code)return;
      decrypt(code).then(function(p){
        try{localStorage.setItem('slf_gate_code',code);}catch(e){}
        launch(p);
      }).catch(function(){document.getElementById('slfGateErr').style.visibility='visible';});
    };
    document.getElementById('slfGateBtn').addEventListener('click',tryCode);
    document.getElementById('slfGateCode').addEventListener('keydown',function(e){if(e.key==='Enter')tryCode();});
  }
  var saved=null; try{saved=localStorage.getItem('slf_gate_code');}catch(e){}
  if(saved){decrypt(saved).then(launch).catch(showGate);}else{showGate();}
